version: '3.8'

services:
  solana-sniper-bot:
    build: .
    container_name: solana-sniper-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PAPER_MODE=true
      - LOG_LEVEL=info
    env_file:
      - .env
    ports:
      - "3001:3001"  # API port
      - "9090:9090"  # Metrics port
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./wallets:/app/wallets:ro  # Read-only wallet access
    networks:
      - solana-bot-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  # Optional: Redis for caching (uncomment if needed)
  # redis:
  #   image: redis:7-alpine
  #   container_name: solana-bot-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - solana-bot-network
  #   command: redis-server --appendonly yes

  # Optional: Prometheus for metrics (uncomment if needed)
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: solana-bot-prometheus
  #   restart: unless-stopped
  #   ports:
  #     - "9091:9090"
  #   volumes:
  #     - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   networks:
  #     - solana-bot-network
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #     - '--web.console.libraries=/etc/prometheus/console_libraries'
  #     - '--web.console.templates=/etc/prometheus/consoles'

networks:
  solana-bot-network:
    driver: bridge

volumes:
  # redis-data:
  # prometheus-data:
  bot-data: